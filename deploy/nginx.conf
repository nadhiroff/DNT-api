# NovaBase — exemple de configuration Nginx + PHP-FPM.
# Copiez dans /etc/nginx/sites-available/novabase, adaptez server_name, chemins et socket PHP-FPM.
# Les certificats sont fournis par Let's Encrypt (certbot --nginx -d novabase.example.com).

limit_req_zone $binary_remote_addr zone=nb_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name novabase.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name novabase.example.com;

    # SEUL le dossier public/ est exposé.
    root /var/www/novabase/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/novabase.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novabase.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    # Plafond global ; les limites fines (1 Mo données, 10 Mo e-mails, plan pour le storage) sont dans l'application.
    client_max_body_size 64m;
    client_body_timeout 30s;

    # Fichiers cachés : refusés.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Assets compilés : cache long (URL versionnées par empreinte).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Limitation supplémentaire au niveau Nginx sur l'authentification.
    location ~ ^/(login|register|forgot-password|api/v1/[^/]+/auth/) {
        limit_req zone=nb_auth burst=20 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Seul index.php est exécuté ; tout autre .php renvoie 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param NOVABASE_REWRITE 1;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
